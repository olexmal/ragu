<div class="h-full flex flex-col bg-white border-l border-primary-200">
  <!-- Header -->
  <div class="px-4 py-3 border-b border-primary-200 bg-surface-50">
    <h3 class="text-lg font-semibold text-primary-700 flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      <span>Settings</span>
    </h3>
  </div>

  <!-- Settings Content -->
  <div class="flex-1 overflow-y-auto p-4 space-y-6">
    <!-- Query Options -->
    <div>
      <h4 class="text-sm font-semibold text-gray-900 mb-3">Query Options</h4>
      <div class="space-y-4">
        <!-- Version Selector -->
        <div>
          <label for="settings-version" class="block text-sm font-medium text-gray-700 mb-1">
            Version
          </label>
          <select
            id="settings-version"
            [(ngModel)]="selectedVersion"
            (ngModelChange)="onVersionChange()"
            name="version"
            class="w-full px-3 py-2 text-sm border border-primary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
          >
            <option [value]="undefined">All Versions</option>
            @for (version of versions; track version) {
              <option [value]="version">{{ version }}</option>
            }
          </select>
        </div>

        <!-- K Value -->
        <div>
          <label for="settings-k" class="block text-sm font-medium text-gray-700 mb-1">
            Documents to retrieve: {{ k() }}
          </label>
          <input
            type="range"
            id="settings-k"
            [(ngModel)]="k"
            (ngModelChange)="onKChange()"
            name="k"
            min="1"
            max="10"
            class="w-full h-2 bg-primary-200 rounded-lg appearance-none cursor-pointer accent-primary-600"
          />
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>1</span>
            <span>10</span>
          </div>
        </div>

        <!-- Simple Query Toggle -->
        <div>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input
              type="checkbox"
              [(ngModel)]="useSimple"
              (ngModelChange)="onSimpleToggle()"
              name="simple"
              class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500"
            />
            <span class="text-sm text-gray-700">Simple query (faster)</span>
          </label>
          <p class="text-xs text-gray-500 mt-1 ml-6">
            Use a simpler, faster query method with potentially less detailed answers.
          </p>
        </div>
      </div>
    </div>

    <!-- Conversation Actions -->
    <div>
      <h4 class="text-sm font-semibold text-gray-900 mb-3">Conversation</h4>
      <div class="space-y-2">
        <button
          (click)="onClearHistory()"
          class="w-full px-4 py-2 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
        >
          Clear History
        </button>
        <button
          (click)="onExportConversation()"
          class="w-full px-4 py-2 text-sm text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition-colors"
        >
          Export Conversation
        </button>
      </div>
    </div>
  </div>
</div>
