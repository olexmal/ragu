<div class="flex flex-col h-full bg-background-50">
  <!-- Messages Container -->
  <div
    #messagesContainer
    class="flex-1 overflow-y-auto px-6 py-4 space-y-4"
  >
    @if (messages().length === 0) {
      <div class="flex flex-col items-center justify-center h-full text-center">
        <div class="mb-4">
          <svg class="w-16 h-16 text-primary-400 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
          </svg>
        </div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">Start a conversation</h3>
        <p class="text-gray-600 max-w-md">
          Ask questions about your documentation. The system will search through embedded documents to find relevant information.
        </p>
      </div>
    } @else {
      @for (message of messages(); track message.id) {
        <app-chat-message
          [message]="message"
          (messageEdited)="onMessageEdited($event)"
          (messageDeleted)="onMessageDeleted($event)"
          (messageRegenerated)="onMessageRegenerated($event)"
        ></app-chat-message>
      }
    }
  </div>

  <!-- Input Area -->
  <app-chat-input
    [versions]="getVersions()"
    [disabled]="loading()"
    [loading]="loading()"
    [settings]="settings"
    (send)="onSendMessage($event)"
  ></app-chat-input>
</div>
