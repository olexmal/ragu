<div class="bg-white border-t border-primary-200 p-4">
  <form (ngSubmit)="onSend()" class="space-y-4">
    <!-- Message Input -->
    <div class="relative">
      <textarea
        [(ngModel)]="message"
        name="message"
        (keydown)="onKeyDown($event)"
        [disabled]="disabled || loading"
        placeholder="Type your question here... (Press Enter to send, Shift+Enter for new line)"
        rows="3"
        spellcheck="false"
        class="w-full px-4 py-3 pr-14 border border-primary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 resize-none disabled:opacity-50 disabled:cursor-not-allowed"
      ></textarea>
      <button
        type="submit"
        [disabled]="!message().trim() || disabled || loading"
        class="absolute bottom-3 right-3 z-10 p-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm"
        title="Send message (Enter)"
      >
        @if (loading) {
          <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        }
      </button>
    </div>

    <!-- Options Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- Version Selector -->
      <div>
        <label for="version" class="block text-sm font-medium text-gray-700 mb-1">
          Version (optional)
        </label>
        <select
          id="version"
          [(ngModel)]="selectedVersion"
          name="version"
          class="w-full px-3 py-2 text-sm border border-primary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
        >
          <option [value]="undefined">All Versions</option>
          @for (version of versions; track version) {
            <option [value]="version">{{ version }}</option>
          }
        </select>
      </div>

      <!-- K Value -->
      <div>
        <label for="k" class="block text-sm font-medium text-gray-700 mb-1">
          Documents to retrieve
        </label>
        <input
          type="number"
          id="k"
          [(ngModel)]="k"
          name="k"
          min="1"
          max="10"
          class="w-full px-3 py-2 text-sm border border-primary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
        />
      </div>

      <!-- Simple Query Toggle -->
      <div class="flex items-end">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input
            type="checkbox"
            [(ngModel)]="useSimple"
            name="simple"
            class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500"
          />
          <span class="text-sm text-gray-700">Simple query (faster)</span>
        </label>
      </div>
    </div>
  </form>
</div>
