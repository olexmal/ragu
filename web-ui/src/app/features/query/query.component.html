<div class="flex h-full bg-background-50">
  <!-- Chat Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Toolbar -->
    <div class="flex items-center justify-between px-4 py-2 border-b border-primary-200 bg-white">
      <h1 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
        <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        <span>Chat Playground</span>
      </h1>
      <div class="flex items-center gap-2">
        <button
          (click)="toggleSources()"
          class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-primary-300 rounded-lg hover:bg-primary-50 hover:text-primary-700 transition-colors"
          [class.bg-primary-100]="showSources()"
          [class.text-primary-700]="showSources()"
          [class.border-primary-500]="showSources()"
        >
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Sources
          </span>
        </button>
        <button
          (click)="toggleSettings()"
          class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-primary-300 rounded-lg hover:bg-primary-50 hover:text-primary-700 transition-colors"
          [class.bg-primary-100]="showSettings()"
          [class.text-primary-700]="showSettings()"
          [class.border-primary-500]="showSettings()"
        >
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Settings
          </span>
        </button>
      </div>
    </div>

    <!-- Chat Component -->
    <app-chat class="flex-1" [settings]="settings"></app-chat>
  </div>

  <!-- Right Panel (Settings or Sources) -->
  @if (showSettings() || showSources()) {
    <div class="w-80 border-l border-primary-200 flex-shrink-0">
      @if (showSettings()) {
        <app-settings-panel
          [versions]="getVersions()"
          [settings]="settings"
          (settingsChange)="onSettingsChange($event)"
          (clearHistory)="onClearHistory()"
          (exportConversation)="onExportConversation()"
        ></app-settings-panel>
      }
      @if (showSources()) {
        <app-sources-panel
          [sources]="currentSources()"
          [selectedSourceIndex]="selectedSourceIndex()"
        ></app-sources-panel>
      }
    </div>
  }
</div>
