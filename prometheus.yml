global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ragu-monitor'

scrape_configs:
  - job_name: 'ragu-backend'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'ragu-backend'
          environment: 'docker'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

