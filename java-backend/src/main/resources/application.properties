quarkus.http.port=9090
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

# Target stack defaults (see docs/ARCHITECTURE_JAVA.md)
ragu.service.name=RAGU Java Backend
ragu.dependencies.redis=${REDIS_URL:redis://localhost:6379/0}
ragu.dependencies.kafka=${KAFKA_BOOTSTRAP:localhost:9092}
ragu.dependencies.qdrant=${QDRANT_URL:http://localhost:6333}

# Provider defaults
ragu.llm.provider=${LLM_PROVIDER:openrouter}
ragu.embedding.provider=${EMBEDDING_PROVIDER:ollama}
ragu.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
ragu.embedding.dimension=${EMBEDDING_DIMENSION:1536}
ragu.qdrant.collection-base=${COLLECTION_NAME:common-model-docs}
ragu.qdrant.api-key=${QDRANT_API_KEY:}

# Messaging + caching placeholders
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}
ragu.kafka.scrape-requests-topic=scrape-requests
ragu.kafka.scrape-progress-topic=scrape-progress
ragu.kafka.embedding-events-topic=embedding-events
quarkus.redis.host=${REDIS_HOST:localhost}
quarkus.redis.port=${REDIS_PORT:6379}
ragu.redis.rate-limit-bucket=ragu-rate-limits

# Document processing defaults
ragu.document.chunk-size=${DOCUMENT_CHUNK_SIZE:1000}
ragu.document.chunk-overlap=${DOCUMENT_CHUNK_OVERLAP:200}

