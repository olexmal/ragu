quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}
quarkus.http.cors.headers=accept,authorization,content-type,x-api-key,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

# Observability
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.export.prometheus.default-registry=true
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.console.json.pretty-print=false
quarkus.log.level=${LOG_LEVEL:INFO}

# Target stack defaults (see docs/ARCHITECTURE_JAVA.md)
ragu.service.name=RAGU Java Backend
ragu.dependencies.redis=${REDIS_URL:redis://localhost:6379/0}
ragu.dependencies.kafka=${KAFKA_BOOTSTRAP:localhost:9092}
ragu.dependencies.qdrant=${QDRANT_URL:http://localhost:6333}

# Provider defaults
ragu.llm.provider=${LLM_PROVIDER:openrouter}
ragu.embedding.provider=${EMBEDDING_PROVIDER:ollama}
ragu.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
ragu.embedding.dimension=${EMBEDDING_DIMENSION:1536}
ragu.qdrant.collection-base=${COLLECTION_NAME:common-model-docs}
ragu.qdrant.api-key=${QDRANT_API_KEY:}

# Auth & rate limiting
ragu.auth.enabled=${AUTH_ENABLED:false}
ragu.auth.username=${AUTH_USERNAME:admin}
ragu.auth.password=${AUTH_PASSWORD:changeme}
ragu.auth.api-key=${AUTH_API_KEY:unset}
ragu.auth.session-ttl-minutes=${SESSION_TTL_MINUTES:1440}
ragu.auth.session-cookie-name=RAGU_SESSION
ragu.rate-limit.read.per-minute=${RATE_LIMIT_READ:60}
ragu.rate-limit.write.per-minute=${RATE_LIMIT_WRITE:30}

# Messaging + caching placeholders
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}
ragu.kafka.scrape-requests-topic=scrape-requests
ragu.kafka.scrape-progress-topic=scrape-progress
ragu.kafka.embedding-events-topic=embedding-events
quarkus.redis.host=${REDIS_HOST:localhost}
quarkus.redis.port=${REDIS_PORT:6379}
ragu.redis.rate-limit-bucket=ragu-rate-limits

# Document processing defaults
ragu.document.chunk-size=${DOCUMENT_CHUNK_SIZE:1000}
ragu.document.chunk-overlap=${DOCUMENT_CHUNK_OVERLAP:200}

# Scrape pipeline simulation (replace with Kafka wiring in Phase 4)
ragu.scrape.simulation-step-ms=${SCRAPE_SIM_STEP_MS:500}

