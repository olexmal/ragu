services:
  backend:
    build:
      context: ./java-backend
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: ragu-backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_PROFILE=${QUARKUS_PROFILE:-prod}
      - RAGU_DEPENDENCIES_REDIS=${REDIS_URL:-redis://redis:6379/0}
      - RAGU_DEPENDENCIES_KAFKA=${KAFKA_BOOTSTRAP:-localhost:29092}
      - RAGU_DEPENDENCIES_QDRANT=${QDRANT_URL:-http://qdrant:6333}
      - QUARKUS_REDIS_HOST=redis
      - QUARKUS_REDIS_PORT=6379
      - RAGU_AUTH_ENABLED=${AUTH_ENABLED:-false}
      - RAGU_AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - RAGU_AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - RAGU_AUTH_API_KEY=${AUTH_API_KEY:-unset}
      - RAGU_RATE_LIMIT_READ_PER_MINUTE=${RATE_LIMIT_READ:-60}
      - RAGU_RATE_LIMIT_WRITE_PER_MINUTE=${RATE_LIMIT_WRITE:-30}
      - RAGU_KAFKA_SCRAPE_REQUESTS_TOPIC=${SCRAPE_REQUESTS_TOPIC:-scrape-requests}
      - RAGU_KAFKA_SCRAPE_PROGRESS_TOPIC=${SCRAPE_PROGRESS_TOPIC:-scrape-progress}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ragu-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ragu-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ragu-network
    restart: unless-stopped

  frontend-dev:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
      target: development
    container_name: ragu-frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-4200}:4200"
    volumes:
      - ./web-ui:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev
    networks:
      - ragu-network
    restart: unless-stopped

  frontend-prod:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
      target: production
    container_name: ragu-frontend-prod
    ports:
      - "${FRONTEND_PROD_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - prod
    networks:
      - ragu-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ragu-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - with-ollama
    networks:
      - ragu-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  ragu-network:
    driver: bridge
    name: ragu-network

