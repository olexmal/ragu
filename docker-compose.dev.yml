# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - chroma_data:/app/chroma
      - logs:/app/logs
      - rag_settings:/app/.rag_settings
      - temp_files:/app/_temp
    environment:
      - FLASK_DEBUG=True
      - PYTHONUNBUFFERED=1
    command: python3 -m flask --app src.app run --host=0.0.0.0 --port=8080 --reload

  frontend-dev:
    volumes:
      # Mount source for hot reload
      - ./web-ui:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

  celery-worker:
    volumes:
      # Mount source code for development
      - ./src:/app/src:ro
      - chroma_data:/app/chroma
      - logs:/app/logs
      - rag_settings:/app/.rag_settings
      - temp_files:/app/_temp
    environment:
      - PYTHONUNBUFFERED=1

